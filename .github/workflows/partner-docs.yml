# Partner documentation validation and optional PDF smoke build (ADR-004).
name: Partner documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: partner-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate partner docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run partner-docs tests
        run: pnpm partner-docs:test

      - name: Validate partner docs
        run: pnpm partner-docs:validate

  build-pdf:
    name: Build PDF (main smoke)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Pandoc and Tectonic
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc curl
          TECTONIC_VERSION=0.15.0
          curl -fsSL \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o tectonic.tar.gz
          tar xf tectonic.tar.gz
          sudo install -m 0755 tectonic /usr/local/bin/tectonic
          pandoc --version
          tectonic --version

      - name: Install Chromium libraries for Mermaid CLI
        run: |
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64

      - name: Install Puppeteer headless Chrome for mmdc
        run: pnpm exec puppeteer browsers install chrome-headless-shell

      - name: Build partner docs PDF
        env:
          PARTNER_DOCS_PDF_ENGINE: tectonic
        run: pnpm partner-docs:build
